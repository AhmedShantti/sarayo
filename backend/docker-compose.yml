version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: chips_store_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: chips_store
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d chips_store']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
